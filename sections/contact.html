<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Venkatesh — Python Developer &amp; Automation Engineer</title>
    <link rel="canonical" href="https://venkatesh-snowy.vercel.app/#contact">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    colors: {
                        primary: { 50:'#f0fdfa', 100:'#ccfbf1', 500:'#14b8a6', 600:'#0d9488', 700:'#0f766e' },
                        accent:  { 500:'#8b5cf6', 600:'#7c3aed', 700:'#6d28d9' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../style.css">

    <!-- Auto-redirect to main page anchor if loaded directly in browser -->
    <script>
        (function() {
            if (window.top === window.self && !location.search.includes('preview=1')) {
                window.location.replace('/#contact');
            }
        })();
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 font-sans p-4 sm:p-8 min-h-screen">
    <div class="max-w-5xl mx-auto">
        <!-- 8. CONTACT ME SECTION -->
        <div class="space-y-8">
            <div class="text-center max-w-2xl mx-auto space-y-2">
                <span class="text-xs font-bold text-teal-600 dark:text-teal-400 uppercase tracking-widest">Connect</span>
                <h2 class="text-3xl font-display font-bold text-slate-950 dark:text-white">Get In Touch</h2>
                <p class="text-sm text-slate-500">Have a proposal or want to collaborate on Python or AI applications? Write me a message.</p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 max-w-5xl mx-auto items-stretch">
                <!-- Info cards column -->
                <div class="space-y-4 lg:col-span-1">
                    <div class="glass-card rounded-2xl p-5 border border-slate-200/50 dark:border-slate-800/50 flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl bg-teal-500/10 flex items-center justify-center text-teal-600 dark:text-teal-400 text-lg flex-shrink-0">
                            <i class="fas fa-envelope" aria-hidden="true"></i>
                        </div>
                        <div class="leading-tight overflow-hidden">
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Email Address</span>
                            <a href="mailto:babuvenkatesh093@gmail.com" class="text-xs sm:text-sm font-semibold hover:text-teal-500 truncate block">babuvenkatesh093@gmail.com</a>
                        </div>
                    </div>

                    <div class="glass-card rounded-2xl p-5 border border-slate-200/50 dark:border-slate-800/50 flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl bg-teal-500/10 flex items-center justify-center text-teal-600 dark:text-teal-400 text-lg flex-shrink-0">
                            <i class="fas fa-phone-alt" aria-hidden="true"></i>
                        </div>
                        <div class="leading-tight">
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Phone Contact</span>
                            <a href="tel:+919952142302" class="text-xs sm:text-sm font-semibold hover:text-teal-500">+91 99521 42302</a>
                        </div>
                    </div>

                    <div class="glass-card rounded-2xl p-5 border border-slate-200/50 dark:border-slate-800/50 flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl bg-teal-500/10 flex items-center justify-center text-teal-600 dark:text-teal-400 text-lg flex-shrink-0">
                            <i class="fas fa-map-marker-alt" aria-hidden="true"></i>
                        </div>
                        <div class="leading-tight">
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Location Info</span>
                            <span class="text-xs sm:text-sm font-semibold">Madurai, Tamil Nadu, India</span>
                        </div>
                    </div>
                </div>

                <!-- Form Card -->
                <div class="glass-card rounded-2xl p-6 sm:p-8 border border-slate-200/50 dark:border-slate-800/50 lg:col-span-2">
                    <form id="contact-form" class="space-y-4" action="mailto:babuvenkatesh093@gmail.com" method="POST" enctype="text/plain">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="space-y-1.5">
                                <label for="form-name" class="text-xs font-semibold text-slate-500 dark:text-slate-400">Full Name</label>
                                <input type="text" id="form-name" name="name" required placeholder="John Doe" autocomplete="name" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white/40 dark:bg-slate-900/45 focus:outline-none focus:ring-2 focus:ring-teal-500 text-xs sm:text-sm">
                            </div>
                            <div class="space-y-1.5">
                                <label for="form-email" class="text-xs font-semibold text-slate-500 dark:text-slate-400">Email Address</label>
                                <input type="email" id="form-email" name="email" required placeholder="john@example.com" autocomplete="email" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white/40 dark:bg-slate-900/45 focus:outline-none focus:ring-2 focus:ring-teal-500 text-xs sm:text-sm">
                            </div>
                        </div>
                        <div class="space-y-1.5">
                            <label for="form-subject" class="text-xs font-semibold text-slate-500 dark:text-slate-400">Subject</label>
                            <input type="text" id="form-subject" name="subject" required placeholder="Project Proposal / Consultation" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white/40 dark:bg-slate-900/45 focus:outline-none focus:ring-2 focus:ring-teal-500 text-xs sm:text-sm">
                        </div>
                        <div class="space-y-1.5">
                            <label for="form-message" class="text-xs font-semibold text-slate-500 dark:text-slate-400">Message Details</label>
                            <textarea id="form-message" name="message" required rows="4" placeholder="Hello Venkatesh, I would love to discuss..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white/40 dark:bg-slate-900/45 focus:outline-none focus:ring-2 focus:ring-teal-500 text-xs sm:text-sm resize-none"></textarea>
                        </div>
                        
                        <div class="flex items-center justify-between pt-2">
                            <span id="form-status" class="text-xs font-semibold text-slate-400 transition-colors"></span>
                            <button type="submit" class="group px-6 py-2.5 rounded-full bg-teal-600 hover:bg-teal-500 text-white text-xs font-bold shadow-lg shadow-teal-500/20 hover:scale-105 active:scale-95 transition-all flex items-center gap-1.5">
                                Send Message <i class="fas fa-paper-plane group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform text-[10px]" aria-hidden="true"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
