<!DOCTYPE html>
{% load static %}
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Venkatesh Babu Portfolio</title>
    <link rel="stylesheet" href="{% static 'css/style.min.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 950: '#020617' }
                    }
                }
            }
        }
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2314b8a6'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='14' font-weight='800' fill='white'>VB</text></svg>" type="image/svg+xml">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden font-sans select-none">

    <!-- Ambient background glows -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-teal-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Center Login Card -->
    <div class="relative w-full max-w-md z-10">
        <div class="p-[1px] rounded-3xl bg-gradient-to-tr from-teal-500/40 via-slate-800 to-purple-500/30 shadow-2xl backdrop-blur-xl">
            <div class="bg-slate-900/90 rounded-[23px] p-8 sm:p-10 border border-slate-800/80">
                
                <!-- Brand Avatar & Title -->
                <div class="flex flex-col items-center text-center mb-8">
                    <div class="w-16 h-16 rounded-2xl p-0.5 bg-gradient-to-tr from-teal-400 to-purple-500 mb-4 shadow-lg shadow-teal-500/20">
                        <img src="{% static '1.png' %}" alt="Venkatesh" class="w-full h-full object-cover rounded-[14px]">
                    </div>
                    <h1 class="text-2xl font-bold tracking-tight text-white">Portfolio Dashboard</h1>
                    <p class="text-xs text-slate-400 mt-1">Authenticate to access contact messages & analytics</p>
                </div>

                <!-- Error Alert -->
                {% if error %}
                <div class="mb-6 p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs flex items-center gap-2.5">
                    <i class="fas fa-exclamation-circle text-sm flex-shrink-0"></i>
                    <span>{{ error }}</span>
                </div>
                {% endif %}

                <!-- Login Form -->
                <form method="POST" action="{% url 'dashboard_login' %}" class="space-y-4">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ request.GET.next|default:'dashboard' }}">

                    <div class="space-y-1.5">
                        <label for="username" class="text-xs font-semibold text-slate-300">Username</label>
                        <div class="relative">
                            <i class="fas fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                            <input type="text" id="username" name="username" required autofocus placeholder="admin"
                                class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-slate-950/60 border border-slate-800 focus:border-teal-500 focus:ring-1 focus:ring-teal-500 text-xs sm:text-sm text-slate-100 placeholder-slate-500 outline-none transition-all">
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label for="password" class="text-xs font-semibold text-slate-300">Password</label>
                        <div class="relative">
                            <i class="fas fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                            <input type="password" id="password" name="password" required placeholder="••••••••"
                                class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-slate-950/60 border border-slate-800 focus:border-teal-500 focus:ring-1 focus:ring-teal-500 text-xs sm:text-sm text-slate-100 placeholder-slate-500 outline-none transition-all">
                        </div>
                    </div>

                    <div class="pt-2">
                        <button type="submit"
                            class="w-full py-3 rounded-xl bg-gradient-to-r from-teal-500 to-cyan-500 hover:from-teal-400 hover:to-cyan-400 text-slate-950 font-bold text-xs sm:text-sm tracking-wide shadow-lg shadow-teal-500/25 hover:shadow-teal-500/40 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                            <span>Sign In to Dashboard</span>
                            <i class="fas fa-arrow-right text-xs"></i>
                        </button>
                    </div>
                </form>

                <!-- Footer info -->
                <div class="mt-8 pt-6 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-500">
                    <a href="{% url 'home' %}" class="hover:text-teal-400 transition-colors flex items-center gap-1">
                        <i class="fas fa-chevron-left text-[9px]"></i> Back to Portfolio
                    </a>
                    <span>Protected by Django Auth</span>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
